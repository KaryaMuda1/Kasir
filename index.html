<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101b33">
  <meta name="description" content="SMART KASIR — Solusi Kasir Digital, Cepat, Mudah, dan Aman.">
  <title>SMART KASIR — Point of Sale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <section id="auth-screen" class="auth-screen" hidden aria-live="polite">
    <div id="auth-content" class="auth-card"></div>
  </section>
  <div class="app-shell" id="app-shell" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page="dashboard" aria-label="SMART KASIR — Dashboard">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5 12 4l8 4.5-8 4.5-8-4.5Z"/><path d="M4 12.5 12 17l8-4.5M4 16.5l8 4.5 8-4.5"/></svg></span>
        <span class="brand-copy"><strong>SMART <span>KASIR</span></strong><small>POINT OF SALE</small></span>
      </a>
      <div class="side-label">MENU UTAMA</div>
      <nav class="navigation" aria-label="Navigasi utama">
        <button class="nav-link active" data-page="dashboard"><span class="nav-icon">⌂</span>Dashboard</button>
        <button class="nav-link" data-page="kasir"><span class="nav-icon">▣</span>Kasir <span class="nav-badge">POS</span></button>
        <button class="nav-link" data-page="produk"><span class="nav-icon">▦</span>Produk</button>
        <button class="nav-link" data-page="transaksi"><span class="nav-icon">↗</span>Transaksi</button>
        <button class="nav-link" data-page="laporan"><span class="nav-icon">▥</span>Laporan</button>
        <button class="nav-link" data-page="pengguna"><span class="nav-icon">♙</span>Pengguna</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card"><span class="help-icon">✳</span><strong>Butuh bantuan?</strong><p>Aplikasi menyimpan data di browser perangkat ini.</p><button id="storage-info">Tentang penyimpanan <span>→</span></button></div>
        <div class="user-profile"><div class="avatar">A</div><div class="user-copy"><strong id="sidebar-user">Admin Toko</strong><small id="sidebar-role">Administrator</small></div><button class="icon-button logout-button" title="Keluar" aria-label="Keluar">⇥</button></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div class="topbar-left"><button class="icon-button menu-toggle" id="menu-toggle" aria-label="Buka menu">☰</button><div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Dashboard</strong></div></div>
        <div class="topbar-right"><span class="connection"><i></i> Tersimpan di perangkat</span><span class="topbar-divider"></span><span id="topbar-date" class="topbar-date"></span><button class="icon-button top-avatar" title="Ubah password" data-action="change-password">A</button></div>
      </header>
      <section id="page-content" class="page-content" aria-live="polite"></section>
    </main>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <div class="modal-backdrop" id="modal-backdrop" hidden><section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section></div>
</body>
</html>
